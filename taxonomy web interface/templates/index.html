    persist().catch(err => showToast('Save failed: ' + err.message, 'error'));
}

// Briefly highlight the dp <li>s that just landed in a topic, so the user can
// see where their drag ended up. Called *after* renderRight rebuilds the DOM,
// so it queries the fresh elements by their parent topic_id and payload.
function flashLandedDps(parentId, dps) {
    if (!parentId || !Array.isArray(dps) || dps.length === 0) return;
    const containerLi = document.querySelector(
        `.right-pane li[data-node-id="${CSS.escape(String(parentId))}"]`
    );
    if (!containerLi) return;
    const dpList = containerLi.querySelector(':scope > ul.dp-list');
    if (!dpList) return;
    const targets = new Set(dps);
    for (const li of dpList.children) {
        if (!li.dataset || li.dataset.kind !== 'dp') continue;
        let dp;
        try { dp = JSON.parse(li.dataset.payload); } catch (_) { continue; }
        if (!targets.has(dp)) continue;
        // Removing + reflow + re-adding restarts the animation if a previous
        // flash on the same <li> is still in flight.
        li.classList.remove('dp-landed');
        void li.offsetWidth;
        li.classList.add('dp-landed');
    }
}

function containsId(node, id) {
    const target = String(id);
    if (String(node.topic_id) === target) return true;
    if (Array.isArray(node.children)) for (const c of node.children) if (containsId(c, id)) return true;
    return false;
}

// Drop on a topic card (drop-on-rectangle fallback). Triggered from
// dndHooks.onEnd when the cursor is released over a .node-card that isn't
// covered by a dp-list overlay (i.e., the leaf has an expanded dp-list and
// SortableJS therefore saw no drop target). Splices the dragged dp(s) in at
// index 0 of the target topic, expands the list, and flashes the landings.
function dropDpsOnTopicFront(topicId, draggedLi) {
    const parentEntry = findNode(STATE.moderated, topicId);
    if (!parentEntry) return;
    const parent = parentEntry.node;
    if (!Array.isArray(parent.data_points)) parent.data_points = [];

    const incoming = [{
        payload: readPayload(draggedLi),
        side: draggedLi.dataset.side,
        sourceUl: draggedLi.parentElement,
    }];
    if (_multiExtras) for (const x of _multiExtras) incoming.push(x);

    let insertAt = 0;
    let alreadyPlaced = 0;
    const sourceParentIds = new Set();
    const landed = [];

    for (const x of incoming) {
        const dp = x.payload;
        if (typeof dp !== 'string') continue;
        if (x.side === 'left') {
            if (STATE.placed.has(canonicalKey(dp))) { alreadyPlaced++; continue; }
        } else {
            // Right side: remove from old leaf (same- or cross-topic).
            const oldParentId = x.sourceUl && x.sourceUl.dataset && x.sourceUl.dataset.parentId;
            const oldParentEntry = oldParentId && findNode(STATE.moderated, oldParentId);
            if (oldParentEntry) {
                oldParentEntry.node.data_points = (oldParentEntry.node.data_points || []).filter(z => z !== dp);
                if (oldParentEntry.node.data_points.length === 0) delete oldParentEntry.node.data_points;
                sourceParentIds.add(String(oldParentId));
            }
        }
        if (!Array.isArray(parent.data_points)) parent.data_points = [];
        parent.data_points.splice(insertAt, 0, dp);
        landed.push(dp);
        insertAt += 1;
    }

    if (alreadyPlaced > 0) {
        showToast(`${alreadyPlaced} data point${alreadyPlaced === 1 ? '' : 's'} already placed; skipped`, 'error');
    }
    if (landed.length === 0) return;

    STATE.expandedDpLists.add(String(topicId));
    for (const pid of sourceParentIds) STATE.expandedDpLists.add(pid);

    clearDpSelection();
    renderRight();
    flashLandedDps(topicId, landed);
    persist().catch(err => showToast('Save failed: ' + err.message, 'error'));
}

// Same-list dp reorder. Triggered from dndHooks.onEnd because `sort: false`
// keeps SortableJS from firing any drop event for this case. Removes the
// dragged item(s) from parent.data_points and re-inserts them at the index
// the cursor's Y points to, preserving the original document order of the
// multi-selection (so dragging items 3+5+7 keeps them in that order).
function handleIntraListDpReorder(ul, cursorY, draggedLi) {
    const parentId = ul.dataset.parentId;
    const parentEntry = findNode(STATE.moderated, parentId);
    if (!parentEntry) return;
    const parent = parentEntry.node;
    if (!Array.isArray(parent.data_points) || parent.data_points.length === 0) return;
    let dragged;
    try { dragged = JSON.parse(draggedLi.dataset.payload); }
    catch (_) { return; }
    if (typeof dragged !== 'string') return;

    const draggedSet = new Set([dragged]);
    if (_multiExtras) {
        for (const x of _multiExtras) {
            if (typeof x.payload === 'string') draggedSet.add(x.payload);
        }
    }
    const items = parent.data_points.filter(d => draggedSet.has(d));
    const remaining = parent.data_points.filter(d => !draggedSet.has(d));
    if (items.length === 0) return;

    const insertAt = Math.min(insertionIndexAtY(ul, cursorY), remaining.length);
    const newOrder = remaining.slice(0, insertAt).concat(items, remaining.slice(insertAt));
    const unchanged = newOrder.length === parent.data_points.length
        && newOrder.every((v, i) => v === parent.data_points[i]);
    if (unchanged) return;

    parent.data_points = newOrder;
    STATE.expandedDpLists.add(String(parentId));
    clearDpSelection();
    renderRight();
    flashLandedDps(parentId, items);
    persist().catch(err => showToast('Save failed: ' + err.message, 'error'));
}

// --- trial loading -----------------------------------------------------------

async function loadTrial(source, trial) {
    try {
        const r = await fetchJSON(`/api/trial/${source}/${trial}`);
        // The user's blind-evaluation rating already arrived with /api/trials,
        // so we look it up locally instead of asking the server again.
        const entry = STATE.trials.find(t => t.source === source && t.trial === trial);
        STATE.currentTrial = {
            source,
            trial,
            taxonomy: r.taxonomy,
            topicColors: r.topic_colors || {},
            meta: r.meta || {},
            user_rating: (entry && entry.user_rating) || null,
        };
        STATE.placed = new Set(r.placed);
        renderLeft();
        renderModeratedStats();
        updateTrialPickerLabel();
        updateTrialScoresChip();
    } catch (err) {
        showToast('Failed to load trial: ' + err.message, 'error');
    }
}

// --- trial picker / metrics ---------------------------------------------------

// The top-6-per-source cut and the canonical source ordering live on the
// server (see `top_n_per_source` in app.py). `STATE.trials` arrives already
// filtered and sorted — these helpers add only the rating-aware preferences
// and a few convenience accessors.
function metaAvg(t) {
    const m = (t && t.meta) || {};
    if (typeof m.dbcv !== 'number' || typeof m.ccc !== 'number') return -Infinity;
    return (m.dbcv + m.ccc) / 2;
}
function userAvg(t) {
    const r = t && t.user_rating;
    return (r && typeof r.avg === 'number') ? r.avg : null;
}
function fmtScore(v) { return (typeof v === 'number') ? v.toFixed(3) : '—'; }

/** Group server-provided trials by source, preserving source insertion
 *  order. If any trial carries a user rating, items within each group are
 *  re-sorted by user avg desc (unrated trials sink to the bottom). */
function groupBySource(trials) {
    const groups = new Map();
    for (const t of trials) {
        if (!groups.has(t.source)) groups.set(t.source, { label: t.source_label, items: [] });
        groups.get(t.source).items.push(t);
    }
    const anyRated = trials.some(t => userAvg(t) != null);
    if (anyRated) {
        for (const g of groups.values()) {
            g.items.sort((a, b) => {
                const ua = userAvg(a), ub = userAvg(b);
                if (ua != null && ub != null) return ub - ua;
                if (ua != null) return -1;
                if (ub != null) return 1;
                return metaAvg(b) - metaAvg(a);
            });
        }
    }
    return Array.from(groups.entries());
}

/** Single overall best trial across all sources. Prefers the user's top
 *  rating when any exists; otherwise picks by avg DBCV+CCC. */
function bestTrial(trials) {
    if (!trials || trials.length === 0) return null;
    const rated = trials.filter(t => userAvg(t) != null);
    if (rated.length > 0) {
        return rated.reduce((a, b) => (userAvg(b) > userAvg(a) ? b : a));
    }
    return [...trials].sort((a, b) => metaAvg(b) - metaAvg(a))[0];
}

function renderTrialPicker() {
    const menu = document.getElementById('trial-picker-menu');
    menu.innerHTML = '';
    // Server returns the top-6 per source already sorted by avg(DBCV, CCC) desc.
    // Once the user has submitted the blind evaluation, items carry a
    // `user_rating` and groupBySource re-sorts them by user avg desc so the
    // user can start from the template they liked the most.
    const top = bestTrial(STATE.trials);
    for (const [, { label, items }] of groupBySource(STATE.trials)) {
        if (items.length === 0) continue;
        const header = document.createElement('div');
        header.className = 'trial-picker-group';
        header.textContent = label;
        menu.appendChild(header);
        for (const t of items) {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'trial-picker-item';
            if (STATE.currentTrial && STATE.currentTrial.source === t.source && STATE.currentTrial.trial === t.trial) {
                item.classList.add('selected');
            }
            const m = t.meta || {};
            const left = document.createElement('span'); left.className = 'left';
            const num = document.createElement('span'); num.className = 'num';
            const isTop = top && t.source === top.source && t.trial === top.trial && userAvg(t) != null;
            num.textContent = (isTop ? '★ Top rated · ' : '') + (t.source === 'final' ? 'Full reference tree' : `Trial ${t.trial}`);
            if (isTop) num.classList.add('top-rated');
            left.append(num);
            const right = document.createElement('span'); right.className = 'right';
            // The reference tree has no clustering metrics — leave its score slot blank.
            right.textContent = (t.source === 'final') ? '' : `DBCV ${fmtScore(m.dbcv)} · CCC ${fmtScore(m.ccc)}`;
            item.append(left, right);
            const ua = userAvg(t);
            if (ua != null) {
                const rChip = document.createElement('span');
                rChip.className = 'user-rating-chip';
                const cm = t.user_rating.cohesion_mean;
                const fm = t.user_rating.fit_mean;
                rChip.textContent = `★ C${cm.toFixed(0)}% F${fm.toFixed(1)} · ${ua.toFixed(0)}%`;
                item.append(rChip);
            }
            item.addEventListener('click', () => {
                closeTrialPicker();
                loadTrial(t.source, t.trial);
            });
            menu.appendChild(item);
        }
    }
}

function updateTrialPickerLabel() {
    const lbl = document.querySelector('#trial-picker-btn .trial-picker-label');
    if (!STATE.currentTrial) { lbl.textContent = 'Select trial…'; return; }
    const t = STATE.trials.find(x => x.source === STATE.currentTrial.source && x.trial === STATE.currentTrial.trial);
    if (t && t.source === 'final') { lbl.textContent = t.source_label; return; }
    lbl.textContent = t ? `${t.source_label} · Trial ${t.trial}` : `Trial ${STATE.currentTrial.trial}`;
}

function updateTrialScoresChip() {
    const el = document.getElementById('trial-scores');
    const infoBtn = document.getElementById('trial-info-btn');
    const m = STATE.currentTrial && STATE.currentTrial.meta;
    if (!m || typeof m.dbcv !== 'number' || typeof m.ccc !== 'number') {
        el.textContent = '';
        infoBtn.hidden = true;
    } else {
        let txt = `DBCV ${m.dbcv.toFixed(3)} · CCC ${m.ccc.toFixed(3)}`;
        const ua = userAvg(STATE.currentTrial);
        if (ua != null) txt += ` · ★ ${ua.toFixed(0)}%`;
        el.textContent = txt;
        infoBtn.hidden = false;
    }
}

function openTrialPicker() {
    const btn = document.getElementById('trial-picker-btn');
    const menu = document.getElementById('trial-picker-menu');
    renderTrialPicker();
    menu.hidden = false;
    const r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.left = r.left + 'px';
}
function closeTrialPicker() {
    document.getElementById('trial-picker-menu').hidden = true;
}

function buildInfoPopoverContent() {
    const m = STATE.currentTrial && STATE.currentTrial.meta;
    const pop = document.getElementById('trial-info-popover');
    if (!m) { pop.innerHTML = ''; return; }
    const ur = STATE.currentTrial && STATE.currentTrial.user_rating;
    const yourRatingsHtml = ur ? `
        <h4>Your ratings</h4>
        <table>
            <tr><td class="k">Cohesion</td><td class="v">${ur.cohesion_mean.toFixed(0)}%</td></tr>
            <tr><td class="k">Hierarchical fit</td><td class="v">${ur.fit_mean.toFixed(2)}/5</td></tr>
            <tr><td class="k">Overall</td><td class="v">${ur.avg.toFixed(0)}%</td></tr>
        </table>
    ` : '';
    pop.innerHTML = `
        <h4>Hyperparameters</h4>
        <table>
            <tr><td class="k">n_neighbors</td><td class="v">${m.n_neighbors}</td></tr>
            <tr><td class="k">n_components</td><td class="v">${m.n_components}</td></tr>
            <tr><td class="k">min_cluster_size</td><td class="v">${m.min_cluster_size}</td></tr>
            <tr><td class="k">min_samples</td><td class="v">${m.min_samples}</td></tr>
        </table>
        <h4>Fit metrics</h4>
        <table>
            <tr><td class="k">DBCV</td><td class="v">${m.dbcv.toFixed(3)}</td></tr>
            <tr><td class="k">CCC</td><td class="v">${m.ccc.toFixed(3)}</td></tr>
            <tr><td class="k">Outlier Ratio</td><td class="v">${m.outlier_ratio.toFixed(3)}</td></tr>
            <tr><td class="k">Clusters</td><td class="v">${m.clusters}</td></tr>
        </table>
        ${yourRatingsHtml}
    `;
}
function toggleInfoPopover() {
    const btn = document.getElementById('trial-info-btn');
    const pop = document.getElementById('trial-info-popover');
    if (pop.hidden) {
        buildInfoPopoverContent();
        pop.hidden = false;
        const r = btn.getBoundingClientRect();
        pop.style.top = (r.bottom + 6) + 'px';
        pop.style.left = Math.max(8, r.right - 260) + 'px';
    } else {
        pop.hidden = true;
    }
}

// --- empty root --------------------------------------------------------------

const MODERATED_ROOT_NAME = 'Digital passport taxonomy';

async function initEmptyModerated() {
    const root = { topic_id: newId(), topic_name: MODERATED_ROOT_NAME };
    const r = await fetchJSON('/api/moderated', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ taxonomy: root }),
    });
    STATE.moderated = root;
    STATE.placed = new Set(r.placed);
    renderRight();
    renderLeft();
    renderModeratedStats();
}

async function loadDefaultLeftTrial() {
    const top = bestTrial(STATE.trials);
    if (top) await loadTrial(top.source, top.trial);
}

// --- toolbar handlers --------------------------------------------------------

function wireToolbar() {
    document.getElementById('btn-expand-all-dps').addEventListener('click', () => setAllDpListsExpanded(true));
    document.getElementById('btn-collapse-all-dps').addEventListener('click', () => setAllDpListsExpanded(false));
    document.getElementById('btn-sort-dps').addEventListener('click', sortAllDataPointsAlpha);
    document.getElementById('btn-sort-dps-left').addEventListener('click', sortAllDataPointsAlphaLeft);
    document.getElementById('btn-export-json').addEventListener('click', () => {
        window.location = '/api/export/json';
    });
    document.getElementById('btn-export-html').addEventListener('click', () => {
        window.location = '/api/export/html';
    });
    document.getElementById('btn-reset').addEventListener('click', async () => {
        if (!confirm('Discard the current moderated taxonomy and reset the moderation timer to 0:00?')) return;
        await fetchJSON('/api/reset', { method: 'POST' });
        await initEmptyModerated();
        await refreshTimer();
    });

    document.getElementById('mod-timer-toggle').addEventListener('click', onTimerToggle);
    document.getElementById('btn-finish').addEventListener('click', onFinish);
    document.getElementById('btn-reopen').addEventListener('click', onReopen);

    document.getElementById('btn-revisit-evaluation').addEventListener('click', () => {
        window.location = '/evaluation';
    });
    document.getElementById('btn-new-evaluation').addEventListener('click', async () => {
        if (!confirm('Start a new blind evaluation? Your previous ratings will be discarded. Your moderated taxonomy is preserved.')) return;
        try {
            await fetchJSON('/api/evaluation/reset', { method: 'POST' });
            window.location = '/evaluation';
        } catch (err) {
            showToast('Reset failed: ' + err.message, 'error');
        }
    });

    // trial picker (custom dropdown)
    document.getElementById('trial-picker-btn').addEventListener('click', e => {
        e.stopPropagation();
        const menu = document.getElementById('trial-picker-menu');
        if (menu.hidden) openTrialPicker(); else closeTrialPicker();
    });
    document.getElementById('trial-info-btn').addEventListener('click', e => {
        e.stopPropagation();
        toggleInfoPopover();
    });
    document.addEventListener('click', e => {
        if (!e.target.closest('#trial-picker')) closeTrialPicker();
        if (!e.target.closest('#trial-info-btn, #trial-info-popover')) {
            document.getElementById('trial-info-popover').hidden = true;
        }
        // Clear DP selection when clicking outside any dp-list (and not on
        // a delete button, which lives in its own action overlay).
        if (!e.target.closest('.dp-list') && !e.target.closest('.dp-actions')) {
            clearDpSelection();
        }
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            closeTrialPicker();
            document.getElementById('trial-info-popover').hidden = true;
            clearDpSelection();
        }
    });
}

// --- bootstrap ---------------------------------------------------------------

async function bootstrap() {
    wireToolbar();
    renderTimer();
    refreshTimer();
    try {
        STATE.trials = await fetchJSON('/api/trials');
    } catch (err) {
        showToast('Failed to list trials: ' + err.message, 'error');
        return;
    }
    if (STATE.trials.length === 0) {
        showToast('No trial JSONs found under TAXONOMY_DATA_ROOT/generated topic hierarchies/.', 'error');
        return;
    }
    // The custom picker reads STATE.trials at render time; no native <select>
    // to pre-populate. Just refresh the dropdown label.
    updateTrialPickerLabel();

    try {
        const cat = await fetchJSON('/api/catalogue');
        STATE.catalogueSize = cat.size || 0;
    } catch (err) {
        showToast('Catalogue load failed: ' + err.message, 'error');
    }

    const m = await fetchJSON('/api/moderated');
    if (m.taxonomy) {
        STATE.moderated = m.taxonomy;
        STATE.placed = new Set(m.placed);
        renderRight();
    } else {
        await initEmptyModerated();
    }
    // The left pane is for visualization only — show the highest-rated
    // (or highest-scoring) trial as a reference.
    await loadDefaultLeftTrial();
}

bootstrap();
